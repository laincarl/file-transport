name: 构建发布包

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.4

jobs:
  sync-code:
    name: 同步代码到 Gitee
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: gitee-code
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/sync-gitee.mjs code
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: ${{ vars.GITEE_USERNAME }}

  quality:
    name: 代码检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 校验发布标签与应用版本
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APP_VERSION=$(sed -nE 's/^version: ([^+]+).*/\1/p' pubspec.yaml)
          test "v${APP_VERSION}" = "${GITHUB_REF_NAME}" || {
            echo "标签 ${GITHUB_REF_NAME} 与 pubspec 版本 ${APP_VERSION} 不一致"
            exit 1
          }
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/sync-gitee.test.mjs

  android:
    name: Android APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 恢复 Android 签名密钥
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lanlink-upload.jks"
      - name: 构建已签名 APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lanlink-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: 整理安装包
        run: cp build/app/outputs/flutter-apk/app-release.apk '局域快传-android.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: 局域快传-android
          path: 局域快传-android.apk
          retention-days: 14

  windows:
    name: Windows x64
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: 压缩发布目录
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath '局域快传-windows-x64.zip'
      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y
      - name: 生成 Windows 安装程序
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+]+)'
          $version = $match.Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer/windows/lanlink.iss
      - uses: actions/upload-artifact@v4
        with:
          name: 局域快传-windows-x64
          path: |
            局域快传-windows-x64.zip
            dist/局域快传-windows-x64-setup.exe
          retention-days: 14

  macos:
    name: macOS
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: 生成 macOS 磁盘映像
        run: hdiutil create -volname '局域快传' -srcfolder 'build/macos/Build/Products/Release/局域快传.app' -ov -format UDZO '局域快传-macos.dmg'
      - uses: actions/upload-artifact@v4
        with:
          name: 局域快传-macos
          path: 局域快传-macos.dmg
          retention-days: 14

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: 生成应用内更新清单
        run: node .github/scripts/create-update-manifest.mjs
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/lanlink-android.apk
            release/lanlink-windows-x64.zip
            release/lanlink-windows-x64-setup.exe
            release/lanlink-macos.dmg
            release/latest.json

  sync-release:
    name: 同步发行版到 Gitee
    needs: [release, sync-code]
    runs-on: ubuntu-latest
    concurrency:
      group: gitee-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 获取 GitHub 正式发行版原包（不重新构建）
        run: |
          gh release download "$RELEASE_TAG" --dir release
          gh release view "$RELEASE_TAG" --json name,body,tagName,isPrerelease > release/github-release.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
      - run: node .github/scripts/sync-gitee.mjs release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
